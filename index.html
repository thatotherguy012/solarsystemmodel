<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Interactive 3D solar system for hard science fiction: planets, moons, asteroids, comets, your own ships and stations, transfers, distances and light-lag." />
    <title>Solar System Model</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffd27a'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%235aa9ff' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand" title="Solar System Model"><span class="logo" aria-hidden="true">☉</span><span>Solar System Model</span></div>
        <button id="scenario-name" class="scenario-name" title="Scenario name (click to rename)"></button>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search objects… (Enter = focus)" autocomplete="off" spellcheck="false" aria-label="Search objects" />
        </div>
        <div class="spacer"></div>
        <nav class="actions" aria-label="Main actions">
          <button id="btn-add" class="btn primary" title="Add a ship, fleet, station, base or probe">＋ Add</button>
          <div class="menu">
            <button id="scenario-menu-btn" class="btn" aria-haspopup="true" aria-expanded="false" title="Import, export or start a scenario">Scenario ▾</button>
            <div id="scenario-menu" class="menu-pop right" hidden role="menu">
              <button role="menuitem" data-act="import">Import…</button>
              <button role="menuitem" data-act="export">Export (download .json)</button>
              <hr />
              <button role="menuitem" data-act="new">New empty scenario…</button>
              <button role="menuitem" data-act="example">Load the example scenario…</button>
            </div>
          </div>
          <div class="menu">
            <button id="tools-menu-btn" class="btn" aria-haspopup="true" aria-expanded="false" title="Travel planner and story events">Tools ▾</button>
            <div id="tools-menu" class="menu-pop right" hidden role="menu">
              <button role="menuitem" data-act="planner">Travel planner…</button>
              <button role="menuitem" data-act="events">Story events…</button>
            </div>
          </div>
          <div class="seg-switch" role="group" aria-label="Detail level" title="Simple: plain-language summaries. Full: every technical table.">
            <button data-detail="simple" aria-pressed="true" title="Plain-language summaries (technical tables behind “Details”)">Simple</button>
            <button data-detail="full" aria-pressed="false" title="Show every technical table">Full</button>
          </div>
          <button id="btn-help" class="btn" title="Help, controls and accuracy notes">Help</button>
        </nav>
      </header>

      <aside id="sidebar" class="side-panel" aria-label="Object browser">
        <div class="panel-head">
          <span>Objects</span>
          <button id="collapse-left" class="icon-btn panel-chevron" title="Collapse the object list (O)" aria-label="Collapse the object list" aria-expanded="true" aria-controls="object-list">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="object-list" class="object-list"></div>
        <button id="expand-left" class="panel-strip" title="Show the object list (O)" aria-label="Show the object list" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="strip-label">Objects</span>
        </button>
      </aside>

      <main id="viewport">
        <div id="canvas-host" class="canvas-host"></div>
        <div class="overlay-top">
          <div id="toggle-chips" class="chips" role="group" aria-label="Visibility"></div>
          <label class="marker-size" title="Minimum on-screen body radius (0 = true scale)">
            <span>Marker size</span>
            <input id="marker-size" type="range" min="0" max="12" step="1" />
            <span id="marker-size-val" class="mono"></span>
          </label>
          <div class="menu">
            <button id="view-menu-btn" class="btn small" aria-haspopup="true" aria-expanded="false" title="Camera views and extra layers">View ▾</button>
            <div id="view-menu" class="menu-pop" hidden role="menu">
              <button role="menuitem" data-view="top">Top-down</button>
              <button role="menuitem" data-view="oblique">Oblique (35°)</button>
              <hr />
              <button role="menuitem" data-view="inner">Inner system (3.5 AU)</button>
              <button role="menuitem" data-view="belt">Asteroid belt, top-down (13 AU)</button>
              <button role="menuitem" data-view="outer">Outer system (45 AU)</button>
              <button role="menuitem" data-view="kuiper">Kuiper belt (110 AU)</button>
              <hr />
              <button role="menuitem" data-view="frame">Frame selection</button>
              <button role="menuitem" data-view="recentre">Re-centre on the followed object (C)</button>
              <hr />
              <button role="menuitemcheckbox" data-toggle="grid" aria-checked="true">Ecliptic grid</button>
              <button role="menuitemcheckbox" data-toggle="kirkwood" aria-checked="false">Kirkwood gaps (belt)</button>
              <button role="menuitemcheckbox" data-toggle="beltMean" aria-checked="false" title="Draw each asteroid at its average distance from the Sun (semi-major axis): the resonance gaps then show clearly">Belt at average distance (shows the gaps)</button>
            </div>
          </div>
          <div id="follow-pill" class="follow-pill" title="The camera follows this object through time">
            <span>Following: <b data-f="name"></b></span>
            <button class="pill-btn" data-f="sun" title="Centre the camera on the Sun">Follow Sun</button>
            <button class="pill-btn" data-f="recentre" title="Bring the view back onto the followed object (C or double-click it)" hidden>Re-centre</button>
          </div>
          <div id="tip-strip" class="tip-strip" hidden>
            <span><b>Tip:</b> click a body to select · drag to rotate · right-drag to pan · scroll to zoom · select a ship and press <kbd>G</kbd> to send it somewhere</span>
            <button class="icon-btn small" data-f="dismiss" title="Dismiss this tip" aria-label="Dismiss this tip">✕</button>
          </div>
        </div>
        <div id="camera-info" class="overlay-info mono"></div>
        <div id="measure-banner" class="overlay-banner" hidden></div>
      </main>

      <aside id="inspector" class="side-panel" aria-label="Inspector">
        <div class="panel-head">
          <button id="collapse-right" class="icon-btn panel-chevron" title="Collapse the inspector (I)" aria-label="Collapse the inspector" aria-expanded="true" aria-controls="inspector-body">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span>Inspector</span>
        </div>
        <div id="inspector-body" class="panel-scroll"></div>
        <button id="expand-right" class="panel-strip" title="Show the inspector (I)" aria-label="Show the inspector" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="strip-label">Inspector</span>
        </button>
      </aside>

      <footer id="bottombar">
        <div id="timebar" class="timebar"></div>
        <div id="timeline" class="timeline"></div>
      </footer>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
